
name: nexus_app
description: A personal wearable operating system mobile companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_blue_plus: ^1.29.0 # For BLE communication
  speech_to_text: ^7.4.0 # For speech-to-text
  flutter_tts: ^4.0.2 # For text-to-speech
  flutter_local_notifications: ^17.0.0 # For local notifications
  go_router: ^14.0.0 # For navigation
  riverpod: ^2.5.1 # For state management
  flutter_riverpod: ^2.5.1 # For state management
  sqflite: ^2.3.3 # For SQLite database
  path_provider: ^2.1.3 # For getting app document directory
  http: ^1.2.1 # For HTTP requests to laptop agent
  web_socket_channel: ^3.0.0 # For WebSocket communication to laptop agent
  intl: ^0.19.0 # For date formatting
  logger: ^2.2.0 # For logging
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/

